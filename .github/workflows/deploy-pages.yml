name: Deploy site (all apps) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "where-should-i-live/**"
      - "movie-quiz/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build where-should-i-live (static export)
        working-directory: where-should-i-live
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          npm ci
          rm -rf src/app/api
          npm run build

      - name: Build ReelRadar (movie-quiz) (static export)
        working-directory: movie-quiz
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Stage Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R where-should-i-live/out/. _site/
          mkdir -p _site/radar-reel
          cp -R movie-quiz/out/. _site/radar-reel/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

