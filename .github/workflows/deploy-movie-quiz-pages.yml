# Build static Next.js app in movie-quiz/ and deploy via GitHub Actions (Pages artifact).
# First-time: Settings → Pages → Build and deployment → Source = GitHub Actions.

name: Deploy ReelRadar (movie-quiz) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "movie-quiz/**"
      - ".github/workflows/deploy-movie-quiz-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: movie-quiz/package-lock.json

      - name: Install and build (static export)
        working-directory: movie-quiz
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Stage artifact under /radar-reel
        run: |
          rm -rf _site
          mkdir -p _site/radar-reel
          cp -R movie-quiz/out/. _site/radar-reel/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
